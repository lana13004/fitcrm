<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FitCRM - Add New Client</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .form-container {
      max-width: 600px;
      margin: 40px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .form-container h2 {
      margin-bottom: 20px;
      text-align: center;
      color: #333;
    }

    .form-group {
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
    }

    label {
      font-weight: bold;
      margin-bottom: 5px;
    }

    input, select {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    .btn-add {
      background-color: #4CAF50;
      color: white;
      padding: 12px;
      width: 100%;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      transition: 0.3s;
    }

    .btn-add:hover {
      background-color: #45a049;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 15px;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <div class="form-container">
    <h2>New Client Form</h2>

    <div class="form-group">
      <label>Full Name</label>
      <input type="text">
    </div>

    <div class="form-group">
      <label>Age</label>
      <input type="number">
    </div>

    <div class="form-group">
      <label>Gender</label>
      <select>
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
      </select>
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email">
    </div>

    <div class="form-group">
      <label>Phone</label>
      <input type="tel">
    </div>

    <div class="form-group">
      <label>Fitness Goal</label>
      <select>
        <option>Weight Loss</option>
        <option>Muscle Gain</option>
        <option>General Fitness</option>
      </select>
    </div>

    <div class="form-group">
      <label>Membership Start Date</label>
      <input type="date">
    </div>

    <button class="btn-add">Add Client</button>

    <a class="back-link" href="clients.html">Back to Client List</a>
  </div>

</body>
</html>
